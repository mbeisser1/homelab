volumes:
  data:
    name: networking_nginx-proxy-manager_data
    external: true
  letsencrypt:
    name: networking_nginx-proxy-manager_letsencrypt
    external: true

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 81:81
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt

#
# Since nginx-proxy-manager and obsidian-assets are defined in the 
# same docker-compose.yml, Docker Compose will attach them both
# to the same auto-created network — in your case nginx-proxy-manager_default
# (confirmed by your docker network ls output). That means NPM
# can reach the obsidian-assets container directly by its container
# name as a hostname, no host port publishing needed (and indeed,
# docker ps shows obsidian-assets only exposes 80/tcp internally, not
# to the host — which is correct/expected for this setup).
  obsidian-assets:
    image: nginx:alpine
    container_name: obsidian-assets
    restart: unless-stopped
    volumes:
      - /pool/docs:/usr/share/nginx/html:ro
      - ./obsidian-assets-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
